services:
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      APP_ENV: "production"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "crm_user"
      DB_PASSWORD: "crm_pass"
      DB_NAME: "crm_db"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_TTL_MINUTES: "5"
      JWT_SECRET: "mini-crm-super-secure-production-secret-token-key-2026"
      JWT_TTL_HOURS: "24"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"

volumes:
  mysql_data:
  redis_data:
